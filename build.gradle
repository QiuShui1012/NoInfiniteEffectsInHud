plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.115'
    id 'io.freefair.lombok' version '8.7.1'
}

String buildNumber
String buildType = 'build'
if (System.getenv("CI_BUILD") == 'false') buildNumber = null
else {
    if (System.getenv("PR_BUILD") != 'false') buildType = 'pr'
    buildNumber = System.getenv("GITHUB_RUN_NUMBER")
}
def envVersion = System.getenv("GITHUB_REF")
if (envVersion != null && envVersion.startsWith("refs/tags/")) {
    version = envVersion.substring(envVersion.lastIndexOf('/') + 1)
} else {
    version = "${mod_version}" + (buildNumber != null ? "+${buildType}.${buildNumber}" : "")
}
group = mod_group_id

base.archivesName = "${mod_id}-${loader_id}-all"

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = parchment_version
    }

    runs {
        var isJbr = System.getProperty('java.vm.vendor').contains('JetBrains')

        // applies to all the run configs below
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            if (isJbr) {
                jvmArgument "-XX:+AllowEnhancedClassRedefinition"
            }

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation(jarJar("io.github.llamalad7:mixinextras-neoforge:0.5.0"))
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_authors            : mod_authors,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }

    doLast {
        def sourceFile = file("${destinationDir.path}/META-INF/neoforge.mods.toml")
        def targetFile = file("${destinationDir.path}/META-INF/mods.toml")

        if (sourceFile.exists()) {
            // 复制并重命名文件
            ant.copy(file: sourceFile, tofile: targetFile)
            logger.lifecycle("Already copied ${sourceFile.name} to ${targetFile.name} for 1.20.2 supporting")
        } else {
            logger.warn("${sourceFile.path} does not exist")
        }

        def sourcePath = "src/main/java/zh/qiushui/mod/nieih/client/gui/"
        sourceFile = file(sourcePath)
        def targetPath = "${destinationDir.path}/zh/qiushui/mod/nieih/client/gui/"

        if (sourceFile.exists()) {
            for (final def file1 in sourceFile.listFiles()) {
                if (!file1.name.endsWith(".class")) continue
                targetFile = file("${targetPath}${file1.name}")
                ant.copy(file: file1, tofile: targetFile)
                logger.lifecycle("Already copied ${sourceFile.name} to ${targetFile.name} for 1.20.2 supporting")
            }
        } else {
            logger.warn("${sourceFile.path} does not exist")
        }
    }
}

tasks.register('sourcesJar', Jar) {
    from delombok.outputs.files
    dependsOn delombok
    archiveClassifier = "sources"
}

artifacts {
    archives tasks.jar
    archives tasks.sourcesJar
}

compileJava.options.encoding = 'UTF-8'

idea.module {
    downloadSources = true
    downloadJavadoc = true
}

lombok.version = "1.18.34"
