displayURL = "${mod_homepage}"
logoFile="icon.png"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "${minecraft_dependency}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_dependency}"
ordering = "NONE"
side = "BOTH"

[mc-publish]
modrinth = "IV2Z12zP"
curseforge = 1368557

[[mixins]]
config="${mod_id}.mixins.json"
